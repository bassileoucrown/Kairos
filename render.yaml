# Render Blueprint for the Kairos app (the `app/` directory).
#
# One web service. In production the Express server also serves the built
# client and hands unknown paths back to index.html for client-side routing
# (see app/server/index.js).
#
# To deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply,
# then set DATABASE_URL on the service (see below).
#
# ---------------------------------------------------------------------------
# DATABASE_URL is the whole point of this file.
#
# Render web instances have an ephemeral filesystem: a SQLite file there is
# wiped on every restart and redeploy, taking every account with it — which
# arrives at the login screen as "Incorrect email or password" and looks
# nothing like a storage problem. app/server/lib/db.js switches to Postgres on
# DATABASE_URL being set, and then data survives restarts, deploys, and the
# free plan's idle sleep.
#
# This blueprint deliberately does NOT declare a database. Render allows one
# free Postgres instance per account, so a blueprint that creates its own
# fails with "cannot have more than one active free tier database" for anyone
# who already has one — which is most people. Point the service at a database
# instead:
#
#   Existing Render Postgres (free tier, one per account)
#     Dashboard -> that database -> copy the Internal Database URL
#     -> this service -> Environment -> DATABASE_URL = that value.
#     If the database already serves another app, also set
#     DATABASE_SCHEMA = kairos so Kairos keeps its tables in a schema of its
#     own and cannot collide with the other app's `users` or `tasks`.
#
#   No Render database yet
#     Dashboard -> New -> Postgres (free) -> then as above. Or use any hosted
#     Postgres — Neon and Supabase both have free tiers with no
#     one-per-account limit, and their connection strings work unchanged.
#
# Free Postgres on Render expires 30 days after creation, then allows a
# 14-day grace period to upgrade before Render deletes it and its data —
# roughly 44 days in total, with warning emails at both points. The harder
# limit is that free Postgres has no backups at all. Fine while evaluating;
# move to a paid instance before this holds a real principal's calendar and
# contacts, whatever the expiry clock says.
#
# Whatever you point it at, the database starts empty. Accounts made against
# an earlier SQLite deployment do not carry over and cannot be recovered —
# sign up once more, after which the account persists. Until DATABASE_URL is
# set the app still runs, on ephemeral SQLite, and the login screen says so
# after a failed sign-in rather than blaming your password.
# ---------------------------------------------------------------------------

# `type: web` is not incidental. A Render *private service* is given no public
# URL at all — it is reachable only from inside your own Render network, so a
# browser has nothing to open. If the goal is "nobody else should get into my
# work", the answer is not to hide the URL: set SIGNUP_ACCESS_CODE below, and
# the link can exist while account creation stays shut.
services:
  - type: web
    name: kairos
    runtime: node
    plan: free
    rootDir: app
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      # sync: false means Render prompts for this at Apply time and never
      # overwrites it on later deploys — set it to your Postgres connection
      # string as described above.
      - key: DATABASE_URL
        sync: false
      # Optional. Set to `kairos` when the database is shared with another
      # app; leave unset to use the default `public` schema.
      - key: DATABASE_SCHEMA
        sync: false
      # SIGNUP_ACCESS_CODE is gone. It guarded account creation, which turned
      # out to be the wrong door: an account on its own reaches nothing —
      # every screen is scoped to a principal, and a stranger who signs up
      # finds no directory, no resolvable handle, no space and no membership.
      # What needed guarding was the step where somebody gains access to a
      # principal's account, and that now has its own gate: each principal
      # sets a pairing code from their Team screen, chooses what it grants,
      # and it is live only for the window they pick. Nothing to configure
      # here.
      # Required before the app will hold identity details (passport numbers,
      # policy numbers) or enable two-factor. 32 bytes, as 64 hex characters:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      #
      # Back this up somewhere that is not this application. Losing it makes
      # every encrypted field permanently unreadable — there is deliberately no
      # recovery path. Without it the app runs normally; only sensitive fields
      # are refused, with an explanation.
      - key: ENCRYPTION_KEY
        sync: false
      # Comma-separated email addresses allowed to publish notices to everyone.
      #
      # Deliberately here rather than a column on users: there is no request
      # that can add somebody to this list, and nothing in the database to
      # flip. Unset means nobody can publish, and the Notices screen says so —
      # to the people who could act on it, and to nobody else.
      - key: ANNOUNCEMENT_AUTHORS
        sync: false
      # Who invitations and reminders appear to come from. Resend will only
      # accept an address on a domain you have verified with them; leave this
      # unset and it falls back to Resend's shared testing sender, which can
      # only deliver to the address that owns the Resend account. Either way
      # the Outbox records what happened, and says so when a send is refused.
      - key: EMAIL_FROM
        sync: false
      # server/lib/db.js also uses node:sqlite for local development, which
      # needs Node 22+.
      - key: NODE_VERSION
        value: "22"
      # Optional: set a Resend API key in the Render dashboard to send real
      # email. Without one, every message is still written to the in-app
      # Outbox tab and the server log, and the password-reset screen says so
      # plainly rather than pointing you at an inbox that will never receive
      # anything.
